name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: backend (pytest, ruff)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check . ../tools
      - run: uv run ruff format --check . ../tools
      - run: uv run pytest -q
      - run: uv run python ../tools/gen_protocol_docs.py --check

  client:
    name: client (Godot headless gdUnit4 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
        working-directory: backend
      - uses: chickensoft-games/setup-godot@v2
        with: { version: 4.7.2, use-dotnet: false }
      # Builds client/.godot/global_script_class_cache.cfg (editor-only step). Without it, headless
      # scripts referencing cross-file `class_name` types (IpcEnvelope, IpcWebSocketClient, ...) fail
      # to parse with "Could not find type X in the current scope".
      - run: godot --headless --editor --path client --quit
      # gdUnit4's CLI tool refuses to run headless without this flag regardless of CI having no
      # display (the check only matters for suites simulating UI input, which ours never do); its own
      # exit code fails the job on any test failure.
      #
      # T-116: process-supervision engine errors (a leaked backend process, a socket reused before it
      # closed) can print without failing a single assertion — that's exactly how this class of bug hid
      # from CI before. Tee the output and grep it so those strings fail the build even when every test
      # happens to pass.
      - run: |
          set -euo pipefail
          godot --headless --path client -s addons/gdUnit4/bin/GdUnitCmdTool.gd -a tests --ignoreHeadlessMode 2>&1 | tee gdunit-output.log
          if grep -q "is not a child of the calling process" gdunit-output.log || grep -q "ERR_ALREADY_IN_USE" gdunit-output.log; then
            echo "::error::process-supervision error found in gdUnit4 output (T-116 guard)"
            exit 1
          fi
